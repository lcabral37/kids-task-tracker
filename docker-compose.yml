version: "3.8"

services:
  kids-task-tracker:
    build: .
    container_name: kids-task-tracker
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: /home/app/data/tasks.db
    volumes:
      - kids-task-tracker-db:/home/app/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  kids-task-tracker-db:
    driver: local
