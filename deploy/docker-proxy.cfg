# HAProxy config for the docker-proxy service in compose.yaml. It stands between autoheal and the
# Docker socket and lets exactly two calls through: list containers, and restart one. Everything
# else (creating containers, exec, images, volumes...) is refused, so a compromised autoheal
# can't take over the host. Only the internal "docker-api" network can reach it.
global
    log stdout format raw daemon info
    maxconn 100

defaults
    mode http
    log global
    option httplog
    timeout connect 10s
    timeout client 1m
    timeout server 1m
    timeout http-request 10s

backend docker
    server socket /var/run/docker.sock

frontend docker_api
    bind :2375
    http-request allow if METH_GET { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/json$ }
    http-request allow if METH_POST { path,url_dec -m reg -i ^(/v[0-9.]+)?/containers/[a-zA-Z0-9_.-]+/restart$ }
    http-request deny deny_status 403
    default_backend docker
