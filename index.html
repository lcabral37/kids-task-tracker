<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kids Task Tracker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Kids Task Tracker</h1>
    </header>
    <main>
        <section>
            <h2>Task List</h2>
            <ul id="taskList">
                <!-- Tasks will be populated here -->
            </ul>
        </section>
        <section>
            <h2>Add New Task</h2>
            <form id="taskForm">
                <input type="text" id="taskInput" placeholder="Enter a new task" required>
                <button type="submit">Add Task</button>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Kids Task Tracker</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
